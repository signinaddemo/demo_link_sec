
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TOTO 影音廣告</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;
    }

    /* 背景圖片 */
    .background {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 廣告外層 */
    #ad-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* 影片容器 */
    #img-wrapper {
      width: 100%;
      max-width: 500px;
      position: relative;
      overflow: hidden;
    }

    /* 主影片 */
    #video {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
    }

    /* 聲音按鈕：右下角 */
    #muteButton {
      position: absolute;
      bottom: 16px;
      right: 10px;
      width: 24px;
      height: 24px;
      z-index: 10;
      cursor: pointer;
    }
  </style>

</head>

<body>

  <!-- 上方背景 -->
  <img
    src="./images/background0.png"
    class="background"
    alt="">

  <img
    src="./images/background1.png"
    class="background"
    alt="">

  <!-- 廣告區域 -->
  <div id="ad-wrapper">

    <div id="img-wrapper">

      <!-- 主影片 -->
      <video
        id="video"
        muted
        playsinline
        loop
        preload="metadata"
        onclick="openUrl()">

        <source
          src="./images/670/video.mp4"
          type="video/mp4">

        Your browser does not support the video tag.

      </video>

      <!-- 聲音按鈕：右下角 -->
      <img
        id="muteButton"
        src="./images/mute.png"
        alt="聲音開關"
        onclick="muteButtonOnClick()">

    </div>

  </div>

  <!-- 下方背景 -->
  <img
    src="./images/background2.png"
    class="background"
    alt="">

  <script>

    /* 取得元素 */
    const video =
      document.getElementById("video");

    const muteButton =
      document.getElementById("muteButton");

    const adWrapper =
      document.getElementById("ad-wrapper");

    /* 初始設定 */
    video.muted = true;
    video.pause();

    /* 聲音開關 */
    function muteButtonOnClick() {

      video.muted = !video.muted;

      muteButton.src =
        `./images/${video.muted ? "mute" : "volume"}.png`;

    }

    /* 廣告進入畫面才播放 */
    const observer = new IntersectionObserver((entries) => {

      const entry = entries[0];

      // 廣告至少 50% 進入畫面
      if (entry.intersectionRatio >= 0.5) {

        if (video.paused) {
          video.play().catch(() => {});
        }

      } else {

        // 離開可視範圍時暫停
        if (!video.paused) {
          video.pause();
        }

      }

    }, {
      threshold: [0, 0.5, 1]
    });

    observer.observe(adWrapper);

    /* 點擊導連 */
    function openUrl() {

      window.open(
        "https://www.twtoto.com.tw",
        "_blank"
      );

    }

  </script>

</body>
</html>
