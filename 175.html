<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>content-gallery h5 template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: transparent; display: flex; flex-direction: column; align-items: center; }
        .container { width: 320px; height: 480px; overflow: hidden; position: relative; }
        
        /* 上方大圖區域 */
        .topImage { display: none; width: 100%; cursor: pointer; }
        
        /* 下方輪播區域 */
        .bottom { position: relative; width: 318px; height: 159px; margin: 0 auto; }
        #bottomImage { position: absolute; z-index: -1; width: 100%; height: 100%; }
        #arrowLeft, #arrowRight { position: absolute; width: 24px; top: 53px; z-index: 100; cursor: pointer; }
        #arrowLeft { left: 4px; }
        #arrowRight { right: 4px; }

        /* Swiper 修正 */
        .swiper { width: 250px; height: 116px; margin-top: 8px; z-index: 10; }
        .swiper-slide { width: 116px; height: 116px; transition: opacity 0.3s; }
        .swiper-slide img { width: 100%; display: block; }
        
        /* 確保可見性 */
        .swiper-slide-prev, .swiper-slide-next, .swiper-slide-active { opacity: 1 !important; }
        #outline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <img src="./images/175/1.png" class="topImage" id="top_1" style="display: block" onclick="openUrl('...')">
            <img src="./images/175/2.png" class="topImage" id="top_2" onclick="openUrl('...')">
            <img src="./images/175/3.png" class="topImage" id="top_3" onclick="openUrl('...')">
            <img src="./images/175/4.png" class="topImage" id="top_4" onclick="openUrl('...')">
        </div>

        <div class="bottom">
            <img src="./images/175/B.png" id="bottomImage" />
            <img src="./images/175/arrowLeft.png" id="arrowLeft" onclick="slidePrev()" />
            <img src="./images/175/arrowRight.png" id="arrowRight" onclick="slideNext()" />
            
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide bottom_2" onclick="updateIndex(2)"><img src="./images/175/2.png"></div>
                    <div class="swiper-slide bottom_3" onclick="updateIndex(3)"><img src="./images/175/3.png"></div>
                    <div class="swiper-slide bottom_4" onclick="updateIndex(4)"><img src="./images/175/4.png"></div>
                </div>
            </div>
        </div>
        <img src="./images/175/5.png" id="outline" />
    </div>

    <script>
        // 1. 初始化 Swiper
        const swiper = new Swiper(".mySwiper", {
            effect: "coverflow",
            centeredSlides: true,
            slidesPerView: "auto",
            loop: true,
            allowTouchMove: true, // 建議開啟，否則手機無法滑動
            spaceBetween: 20,
            coverflowEffect: {
                slideShadows: false,
                rotate: 0,
                stretch: 0,
                depth: 100,
            },
        });

        // 2. 切換函數
        const slideNext = () => swiper.slideNext();
        const slidePrev = () => swiper.slidePrev();

        // 3. 修正 updateIndex，只負責切換上方圖片顯示
        const updateIndex = (newIndex) => {
            // 隱藏所有大圖
            document.querySelectorAll('.topImage').forEach(img => img.style.display = 'none');
            // 顯示點選的大圖
            const target = document.getElementById(`top_${newIndex}`);
            if (target) target.style.display = "block";
        };

        const openUrl = (url) => window.open(url, '_blank');
    </script>
</body>
</html>
