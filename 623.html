<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>content-gallery h5 template</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <style>
      * {
        margin: 0;
      }

      body {
        background-color: transparent;
      }

      .banner {
        width: 100vw;
        height: 150vw;
        overflow: hidden;
        position: relative;
      }

      #startVideo {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transition: 0.5s;
        z-index: 100;
      }

      .swiper-container {
        width: 100%;
        height: 93.75vw;
      }

      .swiper-slide {
        overflow: visible !important;
      }

      .swiper-slide-shadow {
        opacity: 1 !important;
        background: transparent !important;
        box-shadow: 15px 0px 5px 0px rgba(0, 0, 0, 0.4) !important;
      }

      .swiper-slide-img {
        width: 100%;
        height: 93.75vw;
        padding: 5px;
        box-sizing: border-box;
      }

      #swiperContainer {
        display: none;
      }

      #videoContainer {
        width: 100%;
        height: 56.25vw;
        position: relative;
        display: none;
      }

      @keyframes move {
        0% {
          left: 55%;
        }
        50% {
          left: 45%;
        }
        100% {
          left: 55%;
        }
      }

     #finger {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 999;
  opacity: 1;
  transition: opacity 0.5s;
  width: 64px;
  height: 64px;
  pointer-events: none;
  animation: move 1s linear infinite;
}
      }
    </style>
  </head>
  <body>
    <img src="./images/background0.png" style="width: 100vw" />
    <img src="./images/background1.png" style="width: 100vw" />
    <div class="banner" id="banner">
      <video muted playsinline style="width: 100%" id="startVideo">
        <source src="./images/623/start.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <!-- Swiper -->
      <div class="swiper-container" id="swiperContainer">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img
              class="swiper-slide-img"
              src="./images/623/1.jpg"
              alt=""
              onclick="openUrl('https://reurl.cc/jV2yML')"
            />
          </div>
          <div class="swiper-slide">
            <img
              class="swiper-slide-img"
              src="./images/623/2.jpg"
              alt=""
              onclick="openUrl('https://reurl.cc/jV2yML')"
            />
          </div>
          <div class="swiper-slide">
            <img
              class="swiper-slide-img"
              src="./images/623/4.jpg"
              alt=""
              onvclick="openUrl('https://reurl.cc/jV2yML')"
            />
          </div>
           <div class="swiper-slide">
  <img
    class="swiper-slide-img"
    src="./images/623/3.jpg"
    alt=""
    onclick="openUrl('https://reurl.cc/jV2yML')"
  />
</div>

</div> <!-- 關閉 swiper-wrapper -->

<img src="./images/finger.png" alt="" id="finger" />

</div> <!-- 關閉 swiper-container -->
        <img src="./images/finger.png" alt="" id="finger" />
      </div>
      <div id="videoContainer">
        <video
          muted
          playsinline
          loop
          style="width: 100%"
          id="video"
          onclick="openUrl('https://reurl.cc/jV2yML')"
        >
          <source src="./images/623/v.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <img
          onclick="muteButtonOnClick()"
          src="./images/mute.png"
          style="
            position: absolute;
            bottom: 16px;
            right: 10px;
            height: 24px;
            width: 24px;
          "
          id="muteButton"
        />
      </div>
    </div>
    <img src="./images/background2.png" style="width: 100vw" />
  </body>
  <script>
    const startVideo = document.getElementById("startVideo");
    const video = document.getElementById("video");
    const muteButton = document.getElementById("muteButton");
    const finger = document.getElementById("finger");
    const videoContainer = document.getElementById("videoContainer");
    const swiperContainer = document.getElementById("swiperContainer");
    var swiper = new Swiper(".swiper-container", {
      effect: "creative",
      grabCursor: true,
      loop: true,
      spaceBetween: 10,
      speed: 800,
      creativeEffect: {
        limitProgress: 3,
        shadowPerProgress: true,
        prev: {
          translate: ["-120%", 0, 0],
          rotate: [0, 0, 10],
          shadow: true,
        },
        next: {
          translate: ["0%", 0, -500],
        },
      },
    });

    const scrollListener = () => {
      const videoHeight = startVideo.getBoundingClientRect().height;
      const topValue = startVideo.getBoundingClientRect().y;
      const screenH = window.screen.height;

      if (
        topValue < screenH - videoHeight / 2 &&
        topValue > -(videoHeight / 2)
      ) {
        startVideo.play();
        window.removeEventListener("scroll", scrollListener);
      }
    };

    window.addEventListener("scroll", scrollListener);

    startVideo.addEventListener("ended", () => {

  // Start 播完，立即顯示第一張 BN
  swiperContainer.style.display = "block";
  videoContainer.style.display = "block";

  // 移除開場影片，不等待
  startVideo.remove();

  // 更新 Swiper，確保第一張 BN 正常顯示
  swiper.update();
  swiper.slideToLoop(0, 0);

  // 第一張 BN 顯示手指圖示
  finger.style.opacity = "1";

  // 下方影片開始播放
  video.play();

  // 每 2 秒切換下一張 BN
  setInterval(() => {
    swiper.slideNext();
  }, 2000);
});

// 第一次切換 BN 時隱藏手指圖示
swiper.on("slideChange", function () {
  finger.style.opacity = "0";
});

    function muteButtonOnClick() {
      video.muted = !video.muted;
      muteButton.src = `./images/${video.muted ? "mute" : "volume"}.png`;
    }

    function openUrl(url) {
      window.open(url);
    }
  </script>
</html>
