
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>content-gallery h5 template</title>

  <link rel="stylesheet"
        href="https://unpkg.com/swiper@11/swiper-bundle.min.css">

  <script src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;
    }

    /* 整體廣告區塊 */
    .banner {
      width: 100%;
      aspect-ratio: 640 / 960;
      overflow: hidden;
      position: relative;
    }

    /* 開場影片 */
    #startVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 100;
      background: #000;
    }

    /* BN：640 × 600 */
    .swiper-container {
      width: 100%;
      height: 62.5%;
      position: relative;
      overflow: hidden;
    }

    .swiper-slide {
      overflow: hidden;
    }

    .swiper-slide-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      padding: 0;
    }

    #swiperContainer {
      display: none;
    }

    /* 下方影片：640 × 360 */
    #videoContainer {
      width: 100%;
      height: 37.5%;
      position: relative;
      display: none;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 手指左右滑動動畫 */
    @keyframes move {
      0% { left: 55%; }
      50% { left: 45%; }
      100% { left: 55%; }
    }

    #finger {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
      width: 64px;
      height: 64px;
      pointer-events: none;
      animation: move 1s linear infinite;
    }
  </style>
</head>

<body>

  <img src="./images/background0.png"
       style="display:block; width:100%;">

  <img src="./images/background1.png"
       style="display:block; width:100%;">

  <div class="banner" id="banner">

    <!-- Start 開場影片 -->
    <video muted playsinline id="startVideo">
      <source src="./images/623/start.mp4"
              type="video/mp4">
    </video>

    <!-- BN 輪播 -->
    <div class="swiper-container" id="swiperContainer">
      <div class="swiper-wrapper">

        <div class="swiper-slide">
          <img class="swiper-slide-img"
               src="./images/623/1.jpg"
               onclick="openUrl('https://reurl.cc/jV2yML')">
        </div>

        <div class="swiper-slide">
          <img class="swiper-slide-img"
               src="./images/623/2.jpg"
               onclick="openUrl('https://reurl.cc/jV2yML')">
        </div>

        <div class="swiper-slide">
          <img class="swiper-slide-img"
               src="./images/623/4.jpg"
               onclick="openUrl('https://reurl.cc/jV2yML')">
        </div>

        <div class="swiper-slide">
          <img class="swiper-slide-img"
               src="./images/623/3.jpg"
               onclick="openUrl('https://reurl.cc/jV2yML')">
        </div>

      </div>

      <!-- 只保留一個手指圖示 -->
      <img src="./images/finger.png"
           alt=""
           id="finger">

    </div>

    <!-- 下方影片 -->
    <div id="videoContainer">

      <video muted playsinline loop id="video"
             onclick="openUrl('https://reurl.cc/jV2yML')">
        <source src="./images/623/v.mp4"
                type="video/mp4">
      </video>

      <!-- 聲音鍵 -->
      <img onclick="muteButtonOnClick()"
           src="./images/mute.png"
           style="
             position:absolute;
             bottom:16px;
             right:10px;
             width:24px;
             height:24px;
             z-index:10;
           "
           id="muteButton">

    </div>

  </div>

  <img src="./images/background2.png"
       style="display:block; width:100%;">

  <script>
    const startVideo = document.getElementById("startVideo");
    const video = document.getElementById("video");
    const muteButton = document.getElementById("muteButton");
    const finger = document.getElementById("finger");
    const videoContainer = document.getElementById("videoContainer");
    const swiperContainer = document.getElementById("swiperContainer");

    const swiper = new Swiper("#swiperContainer", {
      effect: "creative",
      grabCursor: true,
      loop: true,
      spaceBetween: 10,

      // 切換動畫 0.5 秒
      speed: 500,

      creativeEffect: {
        limitProgress: 3,
        shadowPerProgress: true,
        prev: {
          translate: ["-120%", 0, 0],
          rotate: [0, 0, 10],
          shadow: true
        },
        next: {
          translate: ["0%", 0, -500]
        }
      }
    });

    // Start 播放時不顯示手指
    finger.style.opacity = "0";

    // 捲動至廣告時播放 Start
    const scrollListener = () => {
      const rect = startVideo.getBoundingClientRect();
      const screenH = window.innerHeight;

      if (
        rect.top < screenH - rect.height / 2 &&
        rect.top > -(rect.height / 2)
      ) {
        startVideo.play();
        window.removeEventListener("scroll", scrollListener);
      }
    };

    window.addEventListener("scroll", scrollListener);
    scrollListener();

    // Start 結束後立即顯示第一張 BN
    startVideo.addEventListener("ended", () => {

      swiperContainer.style.display = "block";
      videoContainer.style.display = "block";

      swiper.update();
      swiper.slideToLoop(0, 0);

      startVideo.remove();

      // 第一張 BN 顯示手指
      finger.style.opacity = "1";

      // 下方影片播放
      video.play();

      // 每 2 秒換下一張 BN
      setInterval(() => {
        swiper.slideNext();
      }, 2000);
    });

    // 切換 BN 後隱藏手指
    swiper.on("slideChange", () => {
      finger.style.opacity = "0";
    });

    // 聲音開關
    function muteButtonOnClick() {
      video.muted = !video.muted;
      muteButton.src =
        `./images/${video.muted ? "mute" : "volume"}.png`;
    }

    // 點擊導連
    function openUrl(url) {
      window.open(url);
    }
  </script>

</body>
</html>
