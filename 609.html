<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>content-gallery h5 template</title>

  <style>
    * {
      margin: 0;
    }

    body {
      background-color: transparent;
    }

    .swiper-slide-img {
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <img src="./images/background0.png" style="width: 100vw;" />
  <img src="./images/background1.png" style="width: 100vw;" />

  <div id="ad-wrapper">
    <div onclick="openUrl()">
      <div>
        <video
          id="ad-video"
          class="swiper-slide-img"
          src="./images/609/1.mp4"
          autoplay
          muted
          playsinline
        ></video>
      </div>
    </div>
  </div>

  <img src="./images/background2.png" style="width: 100vw;" />

</body>

<script>
  const video = document.getElementById('ad-video');

  video.addEventListener('ended', function () {
    video.currentTime = 9;
    video.play();
  });

  function openUrl() {
    window.open('https://pxgo.net/3SHyqMu');
  }
</script>

</html>
