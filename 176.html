<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>content-gallery h5 template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
      * { margin: 0; }
      body {
        background-color: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        width: 320px;
        height: 480px;
        overflow: hidden;
        position: relative;
        padding: 1px;
        box-sizing: border-box;
      }
      .topImage {
        display: none;
        width: 100%;
        cursor: pointer;
      }
      .bottom {
        position: relative;
        width: 318px;
        height: 159px;
        display: flex;
        justify-content: center;
      }
      #bottomImage {
        position: absolute;
        z-index: -1;
        width: 100%;
        height: 100%;
      }
      #arrowLeft, #arrowRight {
        position: absolute;
        width: 24px;
        top: 53px;
        z-index: 100;
        cursor: pointer;
      }
      #arrowLeft { left: 4px; }
      #arrowRight { right: 4px; }

      .swiper-container {
        width: 250px;
        height: 116px;
        margin-top: 8px;
        z-index: 10;
        overflow: hidden;
      }
      .swiper-slide {
        width: 116px;
        height: 116px;
        transition: opacity 0.3s;
        cursor: pointer;
      }
      .swiper-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* 確保幻燈片可見 */
      .swiper-slide-active,
      .swiper-slide-next,
      .swiper-slide-prev,
      .swiper-slide-duplicate {
        opacity: 1 !important;
      }
      #outline {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- 追蹤碼保留... -->

    <div class="container">
      <div class="top">
        <!-- 大圖區塊 -->
        <img src="./images/176/1.png" class="topImage" id="top_1" style="display: block" onclick="openUrl('https://maps.app.goo.gl/36e77cMpLm6JQJGw6')" />
        <img src="./images/176/2.png" class="topImage" id="top_2" onclick="openUrl('https://www.uni-ustyle.com.tw/zh-tw')" />
        <img src="./images/176/3.png" class="topImage" id="top_3" onclick="openUrl('https://www.uni-ustyle.com.tw/zh-tw')" />
        <img src="./images/176/4.jpg" class="topImage" id="top_4" onclick="openUrl('https://www.uni-ustyle.com.tw/zh-tw')" />
      </div>

      <div class="bottom">
        <img src="./images/176/bottom.png" id="bottomImage" />
        <img src="./images/176/arrowLeft.png" id="arrowLeft" onclick="slidePrev()" />
        <img src="./images/176/arrowRight.png" id="arrowRight" onclick="slideNext()" />
        
        <div class="swiper-container">
          <div class="swiper-wrapper" id="swiperWrapper">
            <!-- 縮圖由 JS 動態生成 -->
          </div>
        </div>
      </div>
      <img src="./images/176/5.png" alt="" id="outline" />
    </div>

    <script>
      const maxIndex = 4;
      let index = 1;
      
      // 初始化 Swiper
      const swiper = new Swiper(".swiper-container", {
        effect: "coverflow",
        centeredSlides: true,
        slidesPerView: "auto",
        loop: true,
        loopedSlides: 2,
        spaceBetween: 20,
        coverflowEffect: {
          slideShadows: false,
          rotate: 0,
          stretch: 0,
          depth: 100,
        },
      });

      const slideNext = () => swiper.slideNext();
      const slidePrev = () => swiper.slidePrev();

      const updateIndex = (newIndex) => {
        index = newIndex;
        
        // 1. 更新上方大圖
        for (let i = 1; i <= maxIndex; i++) {
          const img = document.getElementById(`top_${i}`);
          if (img) img.style.display = i === index ? "block" : "none";
        }

        // 2. 重新生成縮圖列表
        let slidesHTML = "";
        for (let i = 1; i <= maxIndex; i++) {
          if (i !== index) {
            // 自動判斷副檔名: 1,2,3 是 png, 4 是 jpg
            const ext = (i === 4) ? 'jpg' : 'png';
            slidesHTML += `
              <div class="swiper-slide" onclick="updateIndex(${i})">
                <img src="./images/176/${i}.${ext}" />
              </div>`;
          }
        }

        // 3. 更新 Swiper 內容
        swiper.removeAllSlides();
        // Swiper 需要兩組一樣的內容來維持 Loop 順暢
        swiper.appendSlide([slidesHTML, slidesHTML]); 
        swiper.update();
        swiper.slideToLoop(0, 300);
      };

      const openUrl = (url) => {
        window.open(url, '_blank');
      };

      // 頁面加載後初始化第一次
      window.onload = () => {
        updateIndex(1);
      };
    </script>
  </body>
</html>
