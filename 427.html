<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>content-gallery h5 template</title>
    <style>
      * {
        margin: 0;
      }

      body {
        background-color: transparent;
      }

      .cover {
        position: fixed;
        width: 100vw;
        bottom: 0;
        top: 0;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        z-index: 5;
      }

      .container {
        width: 100vw;
        height: 213vw;
        max-height: 100vh;
        position: relative;
      }

      video {
        width: 100%;
      }

      #video2 {
        display: none;
      }
    </style>
  </head>
  <body>
    <img src="./images/background0.png" style="width: 100vw" />
    <img src="./images/background1.png" style="width: 100vw" />
    <img src="./images/background2.png" style="width: 100vw" />
    <div class="cover" id="ad">
      <img src="./images/close.png" id="close" onclick="closeOnClick()" />
      <div class="container">
        <video muted playsinline autoplay id="video" onclick="openAd()">
          <source src="./images/427/1.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </body>
  <script>
    const ad = document.getElementById("ad");
    const video = document.getElementById("video");
    const firstCutDuration = 3;

    setTimeout(() => {
      // mute button 已移除，這裡不再顯示任何按鈕
    }, firstCutDuration * 1000);

    video.addEventListener("ended", () => {
      video.currentTime = firstCutDuration;
      video.play();
    });

    const closeOnClick = () => {
      ad.remove();
    };

    const openAd = () => {
      window.open("https://www.tw.coupang.com/search?q=%E5%85%89%E6%B3%89%E4%BF%9D%E4%B9%85%E4%B9%B3&src=1043016&spec=10304001&addtag=200&ctag=%E5%85%89%E6%B3%89%E4%BF%9D%E4%B9%85%E4%B9%B3&lptag=%E5%85%89%E6%B3%89%E4%BF%9D%E4%B9%85%E4%B9%B3&itime=20260806011818&pageType=Search&pageValue=%E5%85%89%E6%B3%89%E4%BF%9D%E4%B9%85%E4%B9%B3&wPcid=17859466986617527958451&wRef=&wTime=20260806011818&redirect=landing&af_c_id=&mcid=7f757b294c74488fbc0cab6f54e2196f&af_adset_id=&campaignid=&pid=&af_siteid=&network=&af_click_lookback=&link_click_id=&af_reengagement_window=&af_sub5=&af_sub_siteid=&adgroupid=&campaign=&af_channel=&af_keywords=&filterType=&is_retargeting=&adgroup=&pid=googleads_int&campaignid=22360905783&adgroupid=176524407829&network=g&gad_source=1&gad_campaignid=22360905783&gbraid=0AAAAABS75HWoluZs7uKy2mTtpsI9KQl9m&gclid=Cj0KCQjw7eXTBhDBARIsAKF-w444jM9P9kl-USRNvF2ZegQCQnffAb3rN95G4na7dnJNWxr7ITujKuYaAoV3EALw_wcB");
    };

      let hasLoopStarted = false;

      // 第一次播放完畢，從第 3 秒開始無限播放
      video.addEventListener("ended", () => {
        if (!hasLoopStarted) {
          hasLoopStarted = true;
        }
        // 每次播放完跳回第 3 秒並再次播放（手動模擬 loop）
        video.currentTime = 3;
        video.play();
      });
    </script>
  </body>
</html>
