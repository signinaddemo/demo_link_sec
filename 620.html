<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>content-gallery h5 template</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/plugins/PixiPlugin.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .article-bg {
      display: block;
      width: 100%;
      height: auto;
    }

    #ad-wrapper {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #img-wrapper {
      width: 100%;
      position: relative;
      margin: 0;
      padding: 0;
      overflow: hidden;
      line-height: 0;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      cursor: pointer;
    }

    #muteButton {
      position: absolute;
      bottom: 16px;
      right: 10px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>

  <img src="./images/background0.png" class="article-bg">
  <img src="./images/background1.png" class="article-bg">

  <div id="ad-wrapper">

    <div id="img-wrapper">

      <video
        autoplay
        loop
        muted
        playsinline
        id="video"
        onclick="openUrl()">

        <source src="./images/620/video.mp4" type="video/mp4">

        Your browser does not support the video tag.

      </video>

      <img
        onclick="muteButtonOnClick()"
        src="./images/mute.png"
        id="muteButton">

    </div>

  </div>

  <img src="./images/background2.png" class="article-bg">

</body>

<script>
  const video = document.getElementById('video');
  const muteButton = document.getElementById('muteButton');

  function muteButtonOnClick() {
    video.muted = !video.muted;

    muteButton.src =
      `./images/${video.muted ? 'mute' : 'volume'}.png`;
  }

  function playVideo() {
    video.play();
  }

  function pauseVideo() {
    video.pause();
  }

  function openUrl() {
    window.open(
      'https://www.tmnewa.com.tw/?utm_source=signin&utm_medium=cpc&utm_campaign=signin_corporate_insurance'
    );
  }
</script>

</html>
