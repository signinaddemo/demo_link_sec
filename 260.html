<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>content-gallery h5 template</title>
    <style>
      * {
        margin: 0;
      }

      body {
        background-color: transparent;
      }

      .cover {
        position: fixed;
        width: 100vw;
        bottom: 0;
        top: 0;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #close {
        position: relative;
        top: 0.5%;
        left: 12px;
        width: 30px;
        height: 30px;
        z-index: 5;
      }

      .container {
        width: 100vw;
        height: 213vw;
        max-height: 100vh;
        position: relative;
      }

      /* 移除了 #button 的 CSS 樣式 */

      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }

      #video2 {
        display: none;
      }
    </style>
  </head>
  <body>
    <img src="./images/background0.png" style="width: 100vw" />
    <img src="./images/background1.png" style="width: 100vw" />
    <img src="./images/background2.png" style="width: 100vw" />
    <div class="cover" id="ad">
      <div class="container">
        <img src="./images/13/close.svg" id="close" onclick="closeOnClick()" />
        
        <video muted playsinline autoplay id="video" onclick="openAd()">
          <source src="./images/260/1.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </body>
  <script>
    const ad = document.getElementById("ad");
    const video = document.getElementById("video");
    const firstCutDuration = 0;

    // 移除了控制按鈕顯示的 setTimeout

    video.addEventListener("ended", () => {
      video.currentTime = firstCutDuration;
      video.play();
    });

    const closeOnClick = () => {
      ad.remove();
    };

    const openAd = () => {
      window.open("https://www.mcdonalds.com/tw/zh-tw/whats-hot/0527bbq_season_ft_hutong_mcdonalds.html?utm_source=signin&utm_medium=display&utm_campaign=cp~np-bbqseason_sd~2026-05-27&utm_content=at~ban_cv~signin");
    };

    // 移除了 muteButtonOnClick 函式
  </script>
</html>
